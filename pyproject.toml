[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-test-framework"
version = "0.2.0"
description = "Composable device testing SDK for external test repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko>=3,<5"]
serial = ["pyserial>=3.5,<4"]
host = ["psutil>=5.9,<8", "pyserial>=3.5,<4"]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["unittest"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
